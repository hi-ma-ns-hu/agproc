[tool.ruff]
line-length = 1000
indent-width = 2
target-version = "py312"

[tool.ruff.lint]
# Standard production rule set:
#   E/W  pycodestyle (style)          F    pyflakes (unused imports, undefined names)
#   I    isort (import sorting)       UP   pyupgrade (modernize syntax)
#   B    flake8-bugbear (common bug patterns/gotchas)
select = ["E", "W", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "single"

[tool.pytest.ini_options]
testpaths = ["services"]
python_files = ["tests/*.py"]
